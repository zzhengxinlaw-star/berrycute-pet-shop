<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="./css/styledonat.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Berry-Cute Donate</title>
    <link rel="website icon" type='png' href="./img/webicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>

    <div class="donat">
        <div class="container">
            <img src="./img/berry_cutepink.svg" alt="" class="donat__logo">
            <video src="./video/donatvideo.mp4" width="920px" class="donat__video" controls autoplay></video>
            <p class="donat__text1">A large percentage of your purchases in our store goes to rescue, treatment and food for these beautiful creatures.</p>
            <p class="donat__text2">More than 200,000 RM have already been transferred to us!</p>
            <p class="donat__text3">Don't be indifferent!</p>
            <form action="./indexpayment.html" class="donat__form">
                <label class="donat__form__lable">Please, write amount in RM.</label>
                <input type="text" class="donat__form__input">
                <button class="donat__btn">DONATE</button>
            </form>
            <p class="donat__help">Do you need help with donation?</p>
            
        </div>
    </div>
    
</body>
</html>
